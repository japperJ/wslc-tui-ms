name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  GO_VERSION: '1.24.5'
  WIX_VERSION: '4.0.5'

jobs:
  build-release:
    runs-on: windows-latest
    outputs:
      channel: ${{ steps.release-channel.outputs.channel }}
      prerelease: ${{ steps.release-channel.outputs.prerelease }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine release channel
        id: release-channel
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -match '-') {
            $channel = 'Beta'
            $prerelease = 'true'
          } else {
            $channel = 'Stable'
            $prerelease = 'false'
          }
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install WiX Toolset v4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g WixToolset.Bal.wixext/4.0.5
          wix extension add -g WixToolset.Util.wixext/4.0.5

      - name: Test Go source
        run: |
          go test ./...
          go vet ./...

      - name: Build unsigned distributions
        shell: pwsh
        env:
          SIGNING_COMMAND: ${{ secrets.SIGNING_COMMAND }}
        run: |
          $tag = '${{ github.ref_name }}'
          ./packaging/build.ps1 -Tag $tag -Channel '${{ steps.release-channel.outputs.channel }}' -Output ./dist -Commit '${{ github.sha }}' -BuildDate '${{ github.event.head_commit.timestamp }}'
          if ($env:SIGNING_COMMAND) { & $env:SIGNING_COMMAND ./dist } else { Write-Output 'Signing disabled: SIGNING_COMMAND is unset.' }

      - name: Generate and validate checksums
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $files = @(
            "wslc-tui-$tag-windows-amd64.msi",
            "wslc-tui-$tag-windows-amd64.exe",
            "wslc-tui-$tag-windows-amd64-portable.zip",
            'update-policy.json'
          )
          $assets = foreach ($name in $files) {
            $file = Join-Path ./dist $name
            if (-not (Test-Path $file)) { throw "Missing release payload: $name" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            [ordered]@{ name = $name; sizeBytes = (Get-Item $file).Length; sha256 = $hash }
          }
          [ordered]@{ schemaVersion = 1; releaseTag = $tag; algorithm = 'sha256'; assets = @($assets) } |
            ConvertTo-Json -Depth 5 | Set-Content ./dist/"wslc-tui-$tag-checksums.json" -Encoding utf8NoBOM
          ./packaging/tests/test-package.ps1 -Dist ./dist -Tag $tag
          ./packaging/tests/test-contracts.ps1 -ChecksumManifest ./dist/"wslc-tui-$tag-checksums.json"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.ref_name }}
          path: |
            dist/*.msi
            dist/*.exe
            dist/*portable.zip
            dist/*checksums.json
            update-policy.json

  verify-installer-vm:
    needs: build-release
    # This label must point at a disposable Windows 10/11 x64 snapshot. The
    # runner is restored before each job and uses a fresh standard-user account.
    runs-on: [self-hosted, windows, x64, clean-vm]
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ github.ref_name }}
          path: dist
      - name: Run standard-user installer smoke matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path verification-evidence | Out-Null
          $tag = '${{ github.ref_name }}'
          $installRoot = Join-Path $env:LOCALAPPDATA 'wslc-tui-ms'
          & ./packaging/tests/smoke-msi.ps1 -Msi "./dist/wslc-tui-$tag-windows-amd64.msi" -Bootstrapper "./dist/wslc-tui-$tag-windows-amd64.exe" -InstallRoot $installRoot *>&1 | Tee-Object verification-evidence/msi-result.txt
          if ($LASTEXITCODE -ne 0) { throw 'MSI smoke verification failed.' }
          & ./packaging/tests/smoke-bootstrapper.ps1 -Bootstrapper "./dist/wslc-tui-$tag-windows-amd64.exe" -InstallRoot $installRoot *>&1 | Tee-Object verification-evidence/bootstrapper-result.txt
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrapper smoke verification failed.' }
          Copy-Item (Join-Path $env:TEMP 'wslc-tui-msi-smoke.log') verification-evidence/ -ErrorAction Stop
          Copy-Item (Join-Path $env:TEMP 'wslc-tui-bootstrapper-smoke.log') verification-evidence/ -ErrorAction Stop
          'SMOKE_RESULT=passed' | Set-Content verification-evidence/result-marker.txt
      - name: Publish installer smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-smoke-${{ github.ref_name }}
          path: verification-evidence

  create-release:
    needs: [build-release, verify-installer-vm]
    runs-on: windows-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ github.ref_name }}
          path: dist
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ needs.build-release.outputs.prerelease }}
          files: |
            dist/wslc-tui-${{ github.ref_name }}-windows-amd64.msi
            dist/wslc-tui-${{ github.ref_name }}-windows-amd64.exe
            dist/wslc-tui-${{ github.ref_name }}-windows-amd64-portable.zip
            dist/wslc-tui-${{ github.ref_name }}-checksums.json
            update-policy.json
